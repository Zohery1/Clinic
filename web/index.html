  <script>
    // Universal Mobile & Web Audio Notification Chime (Pure Silence on Click)
    window.notificationAudioCtx = null;

    function initNotificationAudio() {
      try {
        if (!window.notificationAudioCtx) {
          var AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          if (AudioCtxClass) {
            window.notificationAudioCtx = new AudioCtxClass();
          }
        }
        if (window.notificationAudioCtx && window.notificationAudioCtx.state === 'suspended') {
          window.notificationAudioCtx.resume();
        }
      } catch (e) {}
    }

    // Quietly unlock AudioContext on user interaction without producing any click sound
    window.addEventListener('click', initNotificationAudio, { capture: true, passive: true });
    window.addEventListener('touchstart', initNotificationAudio, { capture: true, passive: true });
    window.addEventListener('keydown', initNotificationAudio, { capture: true, passive: true });

    window.playNotificationChime = function() {
      // Play chime ONLY when explicitly called by notification triggers
      try {
        var audioElem = document.getElementById('clinic-chime-audio');
        if (audioElem) {
          audioElem.muted = false;
          audioElem.currentTime = 0;
          var p = audioElem.play();
          if (p && p.catch) p.catch(function(e) {});
        }
      } catch (e) {}

      try {
        initNotificationAudio();
        var ctx = window.notificationAudioCtx;
        if (ctx) {
          var now = ctx.currentTime;
          var osc1 = ctx.createOscillator();
          var osc2 = ctx.createOscillator();
          var gain = ctx.createGain();

          osc1.type = 'sine';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(1174.66, now);
          osc2.frequency.setValueAtTime(1479.98, now + 0.12);

          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start(now);
          osc1.stop(now + 0.12);

          osc2.start(now + 0.12);
          osc2.stop(now + 0.5);
        }
      } catch (e) {}
    };
  </script>
