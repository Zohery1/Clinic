version: '3.8'

services:
  # 1. قاعدة بيانات خاصة بـ Evolution API لحفظ اتصالات الواتساب والجلسات بشكل دائم
  db_evo:
    image: postgres:15-alpine
    container_name: clinic_db_evo
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_evo:/var/lib/postgresql/data
    networks:
      - clinic-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. خادم Redis لتحسين الأداء وتسريع استجابة الجلسات ومجموعات الرسائل
  redis_evo:
    image: redis:7-alpine
    container_name: clinic_redis_evo
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata_evo:/data
    networks:
      - clinic-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. بوابة الواتساب المجانية السريعة (Evolution API)
  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: clinic_evolution_api
    restart: always
    ports:
      - "${EVO_PORT}:8080"
    environment:
      - SERVER_URL=${EVO_SERVER_URL}
      - SERVER_PORT=8080
      - AUTHENTICATION_API_KEY=${EVO_API_KEY}
      # ربط البوابة بقاعدة بيانات PostgreSQL
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_CLIENT=pg
      - DATABASE_CONNECTION_HOST=db_evo
      - DATABASE_CONNECTION_PORT=5432
      - DATABASE_CONNECTION_USER=${POSTGRES_USER}
      - DATABASE_CONNECTION_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_CONNECTION_DATABASE=${POSTGRES_DB}
      # ربط البوابة بكاش Redis لتخزين الحالات المؤقتة
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_HOST=redis_evo
      - CACHE_REDIS_PORT=6379
      - CACHE_REDIS_PASSWORD=${REDIS_PASSWORD}
      # إعدادات النوم التلقائي للجلسات (Auto-sleep) لتوفير الرام
      - INSTANCE_AUTO_CLOSE=${INSTANCE_AUTO_CLOSE}
      - INSTANCE_AUTO_CLOSE_INTERVAL=${INSTANCE_AUTO_CLOSE_INTERVAL}
      - INSTANCE_AUTO_HELPER_CLEANUP=${INSTANCE_AUTO_HELPER_CLEANUP}
    depends_on:
      - db_evo
      - redis_evo
    volumes:
      - evo_instances:/evolution/instances
    networks:
      - clinic-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 4. محرك الأتمتة n8n لإدارة التدفقات والرسائل التلقائية
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: clinic_n8n
    restart: always
    ports:
      - "${N8N_PORT}:5678"
    environment:
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      - GENERIC_TIMEZONE=${TIMEZONE}
      # إعدادات التنظيف التلقائي لسجلات تشغيل الأتمتة لمنع امتلاء الهارد
      - EXECUTIONS_DATA_PRUNE=${EXECUTIONS_DATA_PRUNE}
      - EXECUTIONS_DATA_MAX_AGE=${EXECUTIONS_DATA_MAX_AGE}
      - EXECUTIONS_DATA_PRUNE_TIMEOUT=${EXECUTIONS_DATA_PRUNE_TIMEOUT}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - clinic-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata_evo:
  redisdata_evo:
  evo_instances:
  n8n_data:

networks:
  clinic-network:
    driver: bridge
